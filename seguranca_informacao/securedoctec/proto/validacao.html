<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureDocTec | Validação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <div class="brand">
          <div class="brand-mark">
            <img src="assets/logo_fatec_branco.svg" alt="Logo da FATEC" />
          </div>
        </div>
        <nav class="nav" aria-label="Navegação principal">
          <a href="index.html">Início</a>
          <a href="emissao.html">Emissão</a>
          <a class="active" href="validacao.html">Validação</a>
          <a href="adulteracao.html">Adulteração</a>
          <a href="resumo.html">Resumo</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-header">
          <h2>Validação de documento</h2>
          <p>O verificador apresenta o documento e o sistema calcula o hash para confirmar se a assinatura digital da instituição é válida.</p>
        </div>

        <div class="form-card">
          <form id="validation-form">
            <div class="field full">
              <label for="presentedText">Documento apresentado</label>
              <textarea id="presentedText" name="presentedText"></textarea>
            </div>
            <div class="hero-actions">
              <button class="button button-primary" type="submit">Validar documento</button>
              <a class="button button-secondary" href="adulteracao.html">Ver cenário adulterado</a>
            </div>
          </form>
        </div>

        <div id="validation-output" class="output-panel"></div>
      </div>
    </main>

    <div id="toast" class="status-box" style="position: fixed; right: 20px; bottom: 20px; opacity: 0; transition: opacity 0.2s ease; z-index: 500; min-width: 260px; background: #fff; color: var(--fatec-gray); box-shadow: var(--shadow);"></div>

    <footer class="footer">
      <div class="container">Validação — SecureDocTec</div>
    </footer>
  </body>
</html>
