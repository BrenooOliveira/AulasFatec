<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="400" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Recall@k como taxa de acerto: exemplo com k = 5 e N = 5 consultas</text>
<text x="380" y="50" text-anchor="middle" font-size="11" fill="#555">Valores ilustrativos (fictícios). Acerto = 1 se a interseção entre ground truth e recuperados não é vazia.</text>
<rect x="20" y="66" width="720" height="32" fill="#1e3a5f"/>
<text x="30" y="87" font-size="12" font-weight="bold" fill="#ffffff">Consulta</text>
<text x="100" y="87" font-size="12" font-weight="bold" fill="#ffffff">Ground truth (top-5 exato)</text>
<text x="300" y="87" font-size="12" font-weight="bold" fill="#ffffff">Recuperados@5 (índice aproximado)</text>
<text x="500" y="87" font-size="12" font-weight="bold" fill="#ffffff">Interseção</text>
<text x="640" y="87" font-size="12" font-weight="bold" fill="#ffffff">Acerto</text>
<rect x="20" y="98" width="720" height="38" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="30" y="122" font-size="12" font-weight="bold" fill="#1f2937">q1</text>
<text x="100" y="122" font-size="12" fill="#1d4ed8">{v1, v3, v5, v7, v9}</text>
<text x="300" y="122" font-size="12" fill="#b91c1c">{v1, v3, v6, v7, v11}</text>
<text x="500" y="122" font-size="12" fill="#065f46">{v1, v3, v7}</text>
<rect x="632" y="105" width="92" height="24" rx="5" fill="#d1fae5" stroke="#059669"/>
<text x="678" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">1 (acerto)</text>
<rect x="20" y="136" width="720" height="38" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="160" font-size="12" font-weight="bold" fill="#1f2937">q2</text>
<text x="100" y="160" font-size="12" fill="#1d4ed8">{v2, v4, v8, v12, v15}</text>
<text x="300" y="160" font-size="12" fill="#b91c1c">{v4, v8, v9, v12, v20}</text>
<text x="500" y="160" font-size="12" fill="#065f46">{v4, v8, v12}</text>
<rect x="632" y="143" width="92" height="24" rx="5" fill="#d1fae5" stroke="#059669"/>
<text x="678" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">1 (acerto)</text>
<rect x="20" y="174" width="720" height="38" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="30" y="198" font-size="12" font-weight="bold" fill="#1f2937">q3</text>
<text x="100" y="198" font-size="12" fill="#1d4ed8">{v10, v14, v16, v18, v21}</text>
<text x="300" y="198" font-size="12" fill="#b91c1c">{v2, v3, v22, v23, v24}</text>
<text x="500" y="198" font-size="12" fill="#065f46">vazia</text>
<rect x="632" y="181" width="92" height="24" rx="5" fill="#fee2e2" stroke="#ef4444"/>
<text x="678" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">0 (falha)</text>
<rect x="20" y="212" width="720" height="38" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="236" font-size="12" font-weight="bold" fill="#1f2937">q4</text>
<text x="100" y="236" font-size="12" fill="#1d4ed8">{v1, v2, v3, v4, v5}</text>
<text x="300" y="236" font-size="12" fill="#b91c1c">{v5, v9, v10, v11, v12}</text>
<text x="500" y="236" font-size="12" fill="#065f46">{v5}</text>
<rect x="632" y="219" width="92" height="24" rx="5" fill="#d1fae5" stroke="#059669"/>
<text x="678" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">1 (acerto)</text>
<rect x="20" y="250" width="720" height="38" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="30" y="274" font-size="12" font-weight="bold" fill="#1f2937">q5</text>
<text x="100" y="274" font-size="12" fill="#1d4ed8">{v6, v7, v8, v9, v10}</text>
<text x="300" y="274" font-size="12" fill="#b91c1c">{v6, v7, v8, v9, v10}</text>
<text x="500" y="274" font-size="12" fill="#065f46">os 5 itens</text>
<rect x="632" y="257" width="92" height="24" rx="5" fill="#d1fae5" stroke="#059669"/>
<text x="678" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">1 (acerto)</text>
<rect x="20" y="304" width="720" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="380" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Recall@5 (taxa de acerto) = (1 + 1 + 0 + 1 + 1) / 5 = 4/5 = 0,80</text>
<text x="380" y="352" text-anchor="middle" font-size="12" fill="#374151">Para comparação, a variante clássica (|interseção| / k, por consulta): (0,6 + 0,6 + 0 + 0,2 + 1,0) / 5 = 0,48</text>
<text x="380" y="372" text-anchor="middle" font-size="11" fill="#555">A taxa de acerto é mais permissiva; para k = 1 as duas variantes coincidem.</text>
</svg>
