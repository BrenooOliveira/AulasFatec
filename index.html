<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureDocTec | Redirecionando</title>
    <style>
      :root {
        --primary: #0a1f3d;
        --primary-soft: #214d8f;
        --accent: #d5a733;
        --bg: #f5f7fb;
        --text: #1d2430;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #e9eef8);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        max-width: 620px;
        width: min(90vw, 620px);
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(10, 31, 61, 0.12);
        padding: 2rem 2.2rem;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(33, 77, 143, 0.08);
        color: var(--primary-soft);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      h1 {
        margin: 1rem 0 0.75rem;
        color: var(--primary);
        font-size: clamp(1.8rem, 3vw, 2.8rem);
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        font-size: 1rem;
      }

      a.button {
        display: inline-block;
        text-decoration: none;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        padding: 0.9rem 1.4rem;
        border-radius: 10px;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">SecureDocTec</div>
      <h1>Redirecionando para a demonstração</h1>
      <p>
        Você está sendo encaminhado para a apresentação interativa do protótipo. Se não for
        redirecionado automaticamente, clique no botão abaixo.
      </p>
      <a class="button" href="seguranca_informacao/securedoctec/proto/securedoctec_monolito.html">
        Abrir demonstração
      </a>
    </main>
  </body>
</html>
